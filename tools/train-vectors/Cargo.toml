[package]
name = "train-vectors"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fine-tune sndoc's static (model2vec) embedding table on the ServiceNow docs. Dev utility, not part of the CLI."

# Standalone crate: keep it out of any parent workspace.
[workspace]

[dependencies]
sndoc = { path = "../.." }
anyhow = "1"
rayon = "1"
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "thin"
